<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PuterChat — AI chat powered by Puter.js</title>
  <meta name="description" content="A private, keyless AI chat app. Multiple models, streaming responses, Markdown rendering and local-only conversation history — built on Puter.js." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <!-- Apply the saved theme before first paint (no flash of wrong theme). -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('puterchat:v1:settings') || '{}');
        var t = s.theme || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>

  <link rel="stylesheet" href="styles.css" />

  <!-- Puter.js SDK — the entire AI/auth integration. No API key needed:
       Puter opens its own sign-in popup and bills the USER's account
       ("User-Pays" model). Docs: https://docs.puter.com -->
  <script defer src="https://js.puter.com/v2/"></script>

  <!-- Markdown rendering (marked) + sanitization (DOMPurify).
       DOMPurify strips scripts/event-handlers from rendered Markdown. -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>

  <!-- ══ Inline SVG icon sprite ══════════════════════════════════════ -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="icon-logo" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"
        d="M4 6.5A3.5 3.5 0 0 1 7.5 3h9A3.5 3.5 0 0 1 20 6.5v6a3.5 3.5 0 0 1-3.5 3.5H10l-4.6 3.8a.6.6 0 0 1-1-.46z"/>
      <path fill="currentColor" d="M12 5.8l.95 2.55L15.5 9.3l-2.55.95L12 12.8l-.95-2.55L8.5 9.3l2.55-.95z"/>
    </symbol>
    <symbol id="icon-sparkle" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 4l1.8 4.9L18.7 10.7l-4.9 1.8L12 17.4l-1.8-4.9-4.9-1.8 4.9-1.8z"/>
      <circle cx="18.5" cy="5.5" r="1.6" fill="currentColor"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/>
    </symbol>
    <symbol id="icon-send" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>
    </symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24">
      <rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/>
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24">
      <rect x="9" y="9" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <path fill="none" stroke="currentColor" stroke-width="2" d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 6 9 17l-5-5"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
    </symbol>
    <symbol id="icon-pencil" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>
    </symbol>
    <symbol id="icon-sliders" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>
    </symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"
        d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </symbol>
    <symbol id="icon-monitor" viewBox="0 0 24 24">
      <rect x="2" y="3" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8 21h8M12 17v4"/>
    </symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3 6h18M3 12h18M3 18h18"/>
    </symbol>
    <symbol id="icon-x" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M18 6 6 18M6 6l12 12"/>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        d="M23 4v6h-6M1 20v-6h6M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>
    </symbol>
    <symbol id="icon-dots" viewBox="0 0 24 24">
      <circle cx="12" cy="5" r="1.7" fill="currentColor"/>
      <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
      <circle cx="12" cy="19" r="1.7" fill="currentColor"/>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>
    </symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"
        d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h16.9a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 9v4m0 4h.01"/>
    </symbol>
    <symbol id="icon-info" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 16v-4m0-4h.01"/>
    </symbol>
  </svg>

  <!-- ══ App shell ═══════════════════════════════════════════════════ -->
  <div class="app">

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Conversations">
      <div class="sidebar-head">
        <div class="brand">
          <svg class="icon icon-logo" aria-hidden="true"><use href="#icon-logo"></use></svg>
          <span class="brand-name">PuterChat</span>
        </div>
        <button id="sidebar-close" class="icon-btn sidebar-close" aria-label="Close sidebar">
          <svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg>
        </button>
      </div>

      <button id="new-chat-btn" class="btn-primary new-chat">
        <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
        New chat
      </button>

      <nav class="conv-list-wrap" aria-label="Conversation history">
        <div id="conv-list" class="conv-list"></div>
        <p id="conv-empty" class="conv-empty">No conversations yet.<br>Start one with “New chat”.</p>
      </nav>

      <div class="sidebar-foot">
        <div id="auth-area" class="auth-area"></div>
        <button id="settings-btn" class="foot-btn">
          <svg class="icon" aria-hidden="true"><use href="#icon-sliders"></use></svg>
          Settings
        </button>
      </div>
    </aside>

    <div id="backdrop" class="backdrop" hidden></div>

    <!-- Main chat column -->
    <main class="chat" aria-label="Chat">
      <header class="chat-header">
        <button id="sidebar-toggle" class="icon-btn sidebar-toggle" aria-label="Open sidebar">
          <svg class="icon" aria-hidden="true"><use href="#icon-menu"></use></svg>
        </button>

        <div class="title-wrap">
          <button id="conv-title" class="conv-title" type="button" title="Rename conversation">New conversation</button>
          <input id="conv-title-input" class="conv-title-input" type="text" maxlength="120"
                 aria-label="Conversation name" hidden />
        </div>

        <div class="header-right">
          <select id="model-select" class="model-select" aria-label="AI model"></select>

          <div class="menu-wrap">
            <button id="conv-menu-btn" class="icon-btn" aria-haspopup="true" aria-label="Conversation options">
              <svg class="icon" aria-hidden="true"><use href="#icon-dots"></use></svg>
            </button>
            <div id="conv-menu" class="menu" role="menu" aria-label="Conversation options" hidden>
              <button type="button" role="menuitem" data-menu="rename">
                <svg class="icon" aria-hidden="true"><use href="#icon-pencil"></use></svg> Rename
              </button>
              <button type="button" role="menuitem" data-menu="clear">
                <svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg> Clear messages…
              </button>
              <button type="button" role="menuitem" data-menu="delete" class="danger">
                <svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg> Delete conversation…
              </button>
            </div>
          </div>
        </div>
      </header>

      <div id="messages-scroll" class="messages-scroll">
        <!-- aria-live is off: streaming re-renders would flood screen
             readers; completion/failure is announced via #sr-status. -->
        <div id="messages" class="messages" role="log" aria-live="off" aria-label="Messages"></div>
        <button id="jump-latest" class="jump-pill" type="button" hidden>Jump to latest</button>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <label for="composer-input" class="visually-hidden">Message</label>
          <textarea id="composer-input" class="composer-input" rows="1"
            placeholder="Message PuterChat…"></textarea>
          <button id="send-btn" class="send-btn" type="button" aria-label="Send message" disabled>
            <svg class="icon" aria-hidden="true"><use href="#icon-send"></use></svg>
          </button>
        </div>
        <p class="composer-hint">
          <kbd>Enter</kbd> to send &nbsp;·&nbsp; <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line &nbsp;·&nbsp; AI can make mistakes
        </p>
      </div>

      <div id="sr-status" class="visually-hidden" role="status" aria-live="polite"></div>
    </main>
  </div>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript>
    <div style="padding:2rem;text-align:center;font-family:sans-serif">
      PuterChat requires JavaScript to run.
    </div>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
